<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next Gerenciador - BrunoTV</title>
    <style>
        :root {
            --bg: #f0f2f5;
            --text: #1c1e21;
            --card: #ffffff;
            --accent: #007bff;
            --header-grad: linear-gradient(135deg, #007bff, #0056b3);
            --status-ok: #2ecc71;
            --status-alert: #f39c12;
            --status-danger: #e74c3c;
        }
        
        body.theme-dark { --bg: #121212; --text: #e4e6eb; --card: #242526; --accent: #3a3b3c; --header-grad: linear-gradient(135deg, #2c2c2c, #000000); }
        body.theme-blue { --bg: #0d47a1; --text: #ffffff; --card: #1565c0; --accent: #1976d2; --header-grad: linear-gradient(135deg, #1976d2, #0d47a1); }
        body.theme-green { --bg: #1b5e20; --text: #ffffff; --card: #2e7d32; --accent: #388e3c; --header-grad: linear-gradient(135deg, #388e3c, #1b5e20); }
        body.theme-purple { --bg: #4a148c; --text: #ffffff; --card: #6a1b9a; --accent: #7b1fa2; --header-grad: linear-gradient(135deg, #7b1fa2, #4a148c); }

        body { 
            background-color: var(--bg); 
            color: var(--text); 
            font-family: 'Inter', sans-serif;
            font-weight: 700; 
            margin: 0; 
            padding: 8px; 
            transition: all 0.4s ease; 
            font-size: 0.82rem;
        }

        .header-next { 
            text-align: center; 
            padding: 12px 10px 8px 10px; 
            background: var(--header-grad); 
            color: white; 
            border-radius: 12px 12px 0 0; 
        }
        .header-next .brand-next { font-size: 1.5rem; font-weight: 900; display: block; letter-spacing: -1px; }
        .header-next .sub-gerenciador { font-size: 0.65rem; font-weight: 400; text-transform: uppercase; letter-spacing: 2px; opacity: 0.9; margin-top: -3px; display: block; }

        .theme-bar {
            background: var(--card);
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 6px;
            border-radius: 0 0 12px 12px;
            margin-bottom: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        }
        .theme-btn { width: 22px; height: 22px; border-radius: 5px; cursor: pointer; border: 2px solid transparent; }
        .theme-btn.active { border-color: var(--accent); }

        .controls { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
        input, select, .btn-action { 
            padding: 8px; 
            border-radius: 8px; 
            border: none; 
            background: var(--card); 
            color: var(--text); 
            font-weight: 700;
            font-size: 0.75rem;
        }

        #client-grid { display: grid; gap: 8px; } 
        .view-simples { grid-template-columns: 1fr; }
        .view-duas { grid-template-columns: 1fr 1fr; gap: 6px; }
        .view-completa { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }

        .card { 
            background: var(--card); 
            padding: 10px; 
            border-radius: 12px; 
            position: relative;
            border: 2px solid transparent;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        
        .border-green { border-color: var(--status-ok); }
        .border-orange { border-color: var(--status-alert); }
        .border-red { border-color: var(--status-danger); }

        .info-row { margin-bottom: 4px; display: flex; align-items: center; gap: 5px; font-size: 0.78rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        .days-badge {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.65rem;
            display: inline-block;
            color: #fff;
            font-weight: 900;
            margin-top: 4px;
        }
        .bg-green { background: var(--status-ok); }
        .bg-orange { background: var(--status-alert); }
        .bg-red { background: var(--status-danger); }

        .action-area { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
        
        .btn-renovar { 
            flex-grow: 1;
            background: #2ecc71; 
            color: white; 
            border: none; 
            font-weight: 800; 
            padding: 8px; 
            border-radius: 8px; 
            text-transform: uppercase;
            font-size: 0.65rem;
            cursor: pointer;
        }

        .whatsapp-icon-btn img { width: 28px; height: 28px; }
        .btn-excluir { position: absolute; top: 5px; right: 5px; background: none; border: none; color: #ff4d4d; font-size: 1rem; cursor: pointer; }

        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--card); padding: 15px; border-radius: 15px; z-index: 1000; width: 85%; max-width: 320px; box-shadow: 0 15px 40px rgba(0,0,0,0.3); }
        .modal h3 { font-size: 0.9rem; margin-top: 0; text-align: center; }
        .modal input, .modal select, .modal textarea { width: 100%; margin-bottom: 8px; padding: 8px; border-radius: 6px; border: 1px solid #ddd; font-size: 0.75rem; box-sizing: border-box; }
        .modal textarea { height: 100px; resize: none; }
    </style>
</head>
<body>

    <header class="header-next">
        <span class="brand-next">NEXT</span>
        <span class="sub-gerenciador">Gerenciador</span>
    </header>

    <div class="theme-bar">
        <div class="theme-btn active" style="background:#ffffff; border: 1px solid #ddd;" onclick="setTheme('white', this)"></div>
        <div class="theme-btn" style="background:#212529" onclick="setTheme('dark', this)"></div>
        <div class="theme-btn" style="background:#1976d2" onclick="setTheme('blue', this)"></div>
        <div class="theme-btn" style="background:#2e7d32" onclick="setTheme('green', this)"></div>
        <div class="theme-btn" style="background:#7b1fa2" onclick="setTheme('purple', this)"></div>
    </div>

    <div class="controls">
        <input type="text" id="busca" oninput="render()" placeholder="🔍 BUSCAR..." style="flex-grow: 1;">
        <select id="layout" onchange="changeView(this.value)">
            <option value="view-simples">1 COLUNA</option>
            <option value="view-duas" selected>2 COLUNAS</option>
            <option value="view-completa">GRADE</option>
        </select>
        <button class="btn-action" onclick="openModal('modalNovo')" style="background:#007bff; color:white;">+ NOVO</button>
        <button class="btn-action" onclick="openModal('modalM3U')">LISTA M3U</button>
    </div>

    <div id="client-grid" class="view-duas"></div>

    <!-- MODAL NOVO -->
    <div id="modalNovo" class="modal">
        <h3>NOVO CLIENTE</h3>
        <input type="text" id="novoNome" placeholder="NOME DO CLIENTE">
        <input type="text" id="novoZap" placeholder="WHATSAPP">
        <select id="novoServidor">
            <option value="UNITV">UNITV</option>
            <option value="STARPLAY">STARPLAY</option>
            <option value="BLINDER">BLINDER</option>
            <option value="M3U">LISTA M3U</option>
        </select>
        <input type="text" id="novoLogin" placeholder="LOGIN">
        <input type="text" id="novoSenha" placeholder="SENHA">
        <div style="display:flex; gap:6px;">
            <button class="btn-renovar" onclick="addNovoCliente()">SALVAR</button>
            <button class="btn-action" onclick="closeModal('modalNovo')">SAIR</button>
        </div>
    </div>

    <!-- MODAL M3U CORRIGIDO -->
    <div id="modalM3U" class="modal">
        <h3>IMPORTAR M3U</h3>
        <p style="font-size: 0.6rem; color: #888; margin-bottom: 5px;">Cole o link completo ou o conteúdo #EXTM3U</p>
        <textarea id="m3uContent" placeholder="Ex: http://server.com/get.php?username=USUARIO&password=SENHA..."></textarea>
        <div style="display:flex; gap:6px;">
            <button class="btn-renovar" onclick="importarM3U()">PROCESSAR</button>
            <button class="btn-action" onclick="closeModal('modalM3U')">SAIR</button>
        </div>
    </div>

    <script>
        let clientes = JSON.parse(localStorage.getItem('next_manager_data')) || [];

        function setTheme(theme, el) {
            document.body.className = '';
            if(theme !== 'white') document.body.classList.add('theme-' + theme);
            document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
            if(el) el.classList.add('active');
            localStorage.setItem('next_theme', theme);
        }

        function openModal(id) { document.getElementById(id).style.display = 'block'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function changeView(val) { document.getElementById('client-grid').className = val; }

        function addNovoCliente() {
            const nome = document.getElementById('novoNome').value;
            if(!nome) return alert("Digite o nome!");
            
            clientes.push({
                id: Date.now(),
                nome: nome.toUpperCase(),
                whatsapp: document.getElementById('novoZap').value,
                servidor: document.getElementById('novoServidor').value,
                login_cli: document.getElementById('novoLogin').value || '---',
                senha_cli: document.getElementById('novoSenha').value || '---',
                vencimento: new Date().toISOString().split('T')[0]
            });
            save();
            closeModal('modalNovo');
        }

        function importarM3U() {
            const text = document.getElementById('m3uContent').value;
            if(!text) return alert("Cole a lista ou link!");

            let count = 0;
            // Tenta extrair dados se for um link único com parâmetros
            if(text.includes('username=') && text.includes('password=')) {
                const url = new URL(text.trim().split('\n')[0]);
                const user = url.searchParams.get('username');
                const pass = url.searchParams.get('password');
                const host = url.hostname;

                clientes.push({
                    id: Date.now(),
                    nome: "NOVO CLIENTE M3U",
                    whatsapp: "",
                    servidor: host.toUpperCase(),
                    login_cli: user,
                    senha_cli: pass,
                    vencimento: new Date().toISOString().split('T')[0]
                });
                count = 1;
            } 
            // Se for conteúdo de arquivo #EXTM3U
            else {
                const lines = text.split('\n');
                for(let i=0; i<lines.length; i++) {
                    if(lines[i].includes('#EXTINF:')) {
                        const nome = lines[i].split(',')[1] || "CLIENTE M3U";
                        const link = lines[i+1];
                        let user = '---', pass = '---';
                        
                        if(link && link.includes('?')) {
                            const params = new URLSearchParams(link.split('?')[1]);
                            user = params.get('username') || '---';
                            pass = params.get('password') || '---';
                        }

                        clientes.push({
                            id: Date.now() + count,
                            nome: nome.trim().toUpperCase(),
                            whatsapp: "",
                            servidor: "LISTA M3U",
                            login_cli: user,
                            senha_cli: pass,
                            vencimento: new Date().toISOString().split('T')[0]
                        });
                        count++;
                        i++; // Pula a linha do link
                    }
                }
            }

            if(count > 0) {
                save();
                closeModal('modalM3U');
                document.getElementById('m3uContent').value = '';
                alert(`${count} Cliente(s) adicionado(s)!`);
            } else {
                alert("Não foi possível identificar Usuário/Senha no link.");
            }
        }

        function renovar(id) {
            const idx = clientes.findIndex(c => c.id == id);
            let d = new Date(clientes[idx].vencimento + 'T00:00:00');
            const hoje = new Date();
            if (d < hoje) d = hoje;
            d.setDate(d.getDate() + 30);
            clientes[idx].vencimento = d.toISOString().split('T')[0];
            save();
        }

        function remover(id) {
            if(confirm("EXCLUIR?")) {
                clientes = clientes.filter(c => c.id !== id);
                save();
            }
        }

        function save() {
            localStorage.setItem('next_manager_data', JSON.stringify(clientes));
            render();
        }

        function render() {
            const grid = document.getElementById('client-grid');
            const busca = document.getElementById('busca').value.toUpperCase();
            grid.innerHTML = '';
            
            clientes.filter(c => c.nome.includes(busca)).forEach(c => {
                const dataVenc = new Date(c.vencimento + 'T00:00:00');
                const hoje = new Date();
                hoje.setHours(0,0,0,0);
                const dias = Math.ceil((dataVenc - hoje) / (1000 * 60 * 60 * 24));
                
                let colorClass = "border-green", badgeClass = "bg-green", diasTexto = `${dias}D`;
                if (dias <= 0) { colorClass = "border-red"; badgeClass = "bg-red"; diasTexto = dias === 0 ? "HOJE" : "VENC"; }
                else if (dias <= 7) { colorClass = "border-orange"; badgeClass = "bg-orange"; }

                grid.innerHTML += `
                    <div class="card ${colorClass}">
                        <button class="btn-excluir" onclick="remover(${c.id})">×</button>
                        <div class="info-row">👤 <strong>${c.nome}</strong></div>
                        <div class="info-row">🖥️ ${c.servidor}</div>
                        <div class="info-row">📅 ${c.vencimento.split('-').reverse().join('/')}</div>
                        <div class="info-row">🔑 L: ${c.login_cli}</div>
                        <div class="info-row">🔒 S: ${c.senha_cli}</div>
                        <div class="days-badge ${badgeClass}">${diasTexto}</div>
                        
                        <div class="action-area">
                            <button class="btn-renovar" onclick="renovar(${c.id})">RENOVAR</button>
                            <button class="whatsapp-icon-btn" onclick="window.open('https://api.whatsapp.com/send?phone=${c.whatsapp.replace(/\D/g,'')}', '_blank')">
                                <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg">
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        const savedTheme = localStorage.getItem('next_theme');
        if(savedTheme) setTheme(savedTheme, null);
        render();
    </script>
</body>
</html>
