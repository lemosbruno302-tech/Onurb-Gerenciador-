<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next Gerenciador</title>
    <style>
        :root {
            --bg: #f0f2f5;
            --text: #1c1e21;
            --card: #ffffff;
            --accent: #007bff;
            --header-grad: linear-gradient(135deg, #007bff, #0056b3);
            --status-ok: #2ecc71;
            --status-alert: #f39c12;
            --status-danger: #e74c3c;
        }
        
        body.theme-dark { --bg: #121212; --text: #e4e6eb; --card: #242526; --accent: #3a3b3c; --header-grad: linear-gradient(135deg, #2c2c2c, #000000); }
        body.theme-blue { --bg: #0d47a1; --text: #ffffff; --card: #1565c0; --accent: #1976d2; --header-grad: linear-gradient(135deg, #1976d2, #0d47a1); }
        body.theme-green { --bg: #1b5e20; --text: #ffffff; --card: #2e7d32; --accent: #388e3c; --header-grad: linear-gradient(135deg, #388e3c, #1b5e20); }
        body.theme-purple { --bg: #4a148c; --text: #ffffff; --card: #6a1b9a; --accent: #7b1fa2; --header-grad: linear-gradient(135deg, #7b1fa2, #4a148c); }

        body { 
            background-color: var(--bg); 
            color: var(--text); 
            font-family: 'Segoe UI', sans-serif;
            font-weight: 700; 
            margin: 0; 
            padding: 8px; 
            transition: 0.3s; 
            font-size: 0.82rem;
        }

        .header-next { 
            text-align: center; 
            padding: 15px 10px; 
            background: var(--header-grad); 
            color: white; 
            border-radius: 12px; 
            margin-bottom: 10px;
        }
        .header-next span { font-size: 1.5rem; font-weight: 900; letter-spacing: 1px; }

        .theme-bar {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            margin-bottom: 10px;
        }
        .theme-txt-btn {
            background: var(--card);
            color: var(--text);
            border: 1px solid rgba(0,0,0,0.1);
            padding: 8px 0;
            border-radius: 6px;
            font-size: 0.6rem;
            cursor: pointer;
            text-align: center;
            text-transform: uppercase;
        }
        .theme-txt-btn.active { background: var(--accent); color: white; }

        .link-manager-bar { margin-bottom: 10px; }
        .btn-paineis {
            width: 100%; padding: 10px; background: var(--accent); color: white;
            border: none; border-radius: 8px; font-weight: 900; cursor: pointer;
        }

        .controls { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
        input, select, .btn-action { 
            padding: 10px; border-radius: 8px; border: none; 
            background: var(--card); color: var(--text); font-weight: 700;
            font-size: 0.75rem;
        }

        #client-grid { display: grid; gap: 8px; }
        .grid-cols-2 { grid-template-columns: 1fr 1fr; }
        .grid-cols-1 { grid-template-columns: 1fr; }

        .card { 
            background: var(--card); padding: 10px; border-radius: 12px; 
            position: relative; border: 2px solid transparent;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex; flex-direction: column;
        }
        .border-green { border-color: var(--status-ok); }
        .border-orange { border-color: var(--status-alert); }
        .border-red { border-color: var(--status-danger); }

        .info-row { 
            margin-bottom: 3px; font-size: 0.72rem; 
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .info-row strong { color: var(--accent); }
        
        .days-badge {
            padding: 2px 6px; border-radius: 4px; font-size: 0.6rem;
            color: #fff; align-self: flex-start; margin: 4px 0;
        }
        .bg-green { background: var(--status-ok); }
        .bg-orange { background: var(--status-alert); }
        .bg-red { background: var(--status-danger); }

        .action-area { display: flex; gap: 5px; margin-top: auto; align-items: center; }
        .btn-renovar { 
            flex: 1; background: #2ecc71; color: white; border: none; 
            padding: 8px; border-radius: 6px; font-size: 0.65rem; cursor: pointer;
            font-weight: 900;
        }

        .card-tools { position: absolute; top: 5px; right: 5px; display: flex; gap: 4px; }
        .tool-btn { background: rgba(0,0,0,0.08); border: none; cursor: pointer; font-size: 0.8rem; border-radius: 4px; padding: 3px; }

        .modal { 
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            background: var(--card); padding: 20px; border-radius: 15px; z-index: 1000; 
            width: 85%; max-width: 320px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
        }
        .modal input, .modal select { width: 100%; margin-bottom: 10px; padding: 10px; box-sizing: border-box; border-radius: 8px; border: 1px solid #ddd; }
        
        .panel-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px; border-bottom: 1px solid rgba(0,0,0,0.1);
            background: rgba(0,0,0,0.02); margin-bottom: 5px; border-radius: 5px;
        }
        .btn-conectar-link {
            background: #007bff; color: white; border: none; padding: 6px 12px;
            border-radius: 6px; font-size: 0.65rem; cursor: pointer; font-weight: 900;
            text-decoration: none; display: inline-block;
        }
    </style>
</head>
<body>

    <header class="header-next">
        <span>NEXT GERENCIADOR</span>
    </header>

    <div class="theme-bar">
        <button class="theme-txt-btn" onclick="setTheme('white', this)">Padrão</button>
        <button class="theme-txt-btn" onclick="setTheme('dark', this)">Escuro</button>
        <button class="theme-txt-btn" onclick="setTheme('blue', this)">Azul</button>
        <button class="theme-txt-btn" onclick="setTheme('green', this)">Verde</button>
        <button class="theme-txt-btn" onclick="setTheme('purple', this)">Roxo</button>
    </div>

    <div class="link-manager-bar">
        <button class="btn-paineis" onclick="openModal('modalPaineis')">🔗 MEUS PAINÉIS / LINKS</button>
    </div>

    <div class="controls">
        <input type="text" id="busca" oninput="render()" placeholder="🔍 BUSCAR..." style="flex: 1; min-width: 150px;">
        <select id="ordem" onchange="render()" style="flex: 1;">
            <option value="venc">🕒 VENCIMENTO</option>
            <option value="nome">🔤 NOME (A-Z)</option>
            <option value="srv">🖥️ SERVIDOR</option>
        </select>
        <button class="btn-action" onclick="toggleView()" id="btnView">📱 MODO</button>
        <button class="btn-action" onclick="openModalNovo()" style="background:var(--accent); color:white;">+ NOVO</button>
    </div>

    <div id="client-grid" class="grid-cols-2"></div>

    <!-- MODAL CLIENTE -->
    <div id="modalCliente" class="modal">
        <h3 style="margin-top:0; text-align:center;">DADOS CLIENTE</h3>
        <input type="hidden" id="editId">
        <input type="text" id="cliNome" placeholder="NOME">
        <input type="text" id="cliZap" placeholder="WHATSAPP (EX: 5555999999999)">
        <select id="cliServidor">
            <option value="UNITV">UNITV</option>
            <option value="STARPLAY">STARPLAY</option>
            <option value="BLINDER">BLINDER</option>
            <option value="M3U">M3U</option>
        </select>
        <input type="text" id="cliLogin" placeholder="LOGIN">
        <input type="text" id="cliSenha" placeholder="SENHA">
        <input type="date" id="cliVenc">
        <button class="btn-renovar" style="width:100%; margin-bottom:5px; padding:10px;" onclick="saveCliente()">SALVAR</button>
        <button class="btn-action" style="width:100%;" onclick="closeModal('modalCliente')">VOLTAR</button>
    </div>

    <!-- MODAL LINKS -->
    <div id="modalPaineis" class="modal">
        <h3 style="margin-top:0; text-align:center;">SERVIDORES SALVOS</h3>
        <div id="listaLinks" style="max-height: 200px; overflow-y: auto; margin-bottom:10px;"></div>
        <hr>
        <input type="text" id="linkNome" placeholder="NOME DO SERVIDOR">
        <input type="text" id="linkUrl" placeholder="LINK (HTTPS://...)">
        <button class="btn-renovar" style="width:100%; margin-bottom:5px; padding:10px;" onclick="addLink()">ADICIONAR SERVIDOR</button>
        <button class="btn-action" style="width:100%;" onclick="closeModal('modalPaineis')">FECHAR</button>
    </div>

    <script>
        let clientes = JSON.parse(localStorage.getItem('next_data')) || [];
        let linksExternos = JSON.parse(localStorage.getItem('next_links')) || [];
        let viewMode = localStorage.getItem('next_view') || 'grid-cols-2';

        function setTheme(theme, el) {
            document.body.className = '';
            if(theme !== 'white') document.body.classList.add('theme-' + theme);
            document.querySelectorAll('.theme-txt-btn').forEach(b => b.classList.remove('active'));
            if(el) el.classList.add('active');
            localStorage.setItem('next_theme', theme);
        }

        function toggleView() {
            viewMode = (viewMode === 'grid-cols-2') ? 'grid-cols-1' : 'grid-cols-2';
            localStorage.setItem('next_view', viewMode);
            render();
        }

        function openModal(id) { 
            document.getElementById(id).style.display = 'block'; 
            if(id === 'modalPaineis') renderLinks(); 
        }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function openModalNovo() {
            document.getElementById('editId').value = "";
            document.getElementById('cliNome').value = "";
            document.getElementById('cliZap').value = "";
            document.getElementById('cliLogin').value = "";
            document.getElementById('cliSenha').value = "";
            document.getElementById('cliVenc').value = new Date().toISOString().split('T')[0];
            openModal('modalCliente');
        }

        function addLink() {
            const n = document.getElementById('linkNome').value.toUpperCase();
            let u = document.getElementById('linkUrl').value;
            if(!n || !u) return;
            if (!u.startsWith('http')) u = 'https://' + u;
            
            linksExternos.push({ id: Date.now(), nome: n, url: u });
            localStorage.setItem('next_links', JSON.stringify(linksExternos));
            document.getElementById('linkNome').value = '';
            document.getElementById('linkUrl').value = '';
            renderLinks();
        }

        function removeLink(id) {
            linksExternos = linksExternos.filter(l => l.id !== id);
            localStorage.setItem('next_links', JSON.stringify(linksExternos));
            renderLinks();
        }

        function renderLinks() {
            const div = document.getElementById('listaLinks');
            div.innerHTML = '';
            linksExternos.forEach(l => {
                div.innerHTML += `
                <div class="panel-item">
                    <span>${l.nome}</span>
                    <div style="display:flex; gap:5px; align-items:center;">
                        <button class="btn-conectar-link" onclick="window.open('${l.url}', '_blank')">🔗 CONECTAR</button>
                        <button onclick="removeLink(${l.id})" style="border:none; background:none; cursor:pointer;">🗑️</button>
                    </div>
                </div>`;
            });
        }

        function saveCliente() {
            const id = document.getElementById('editId').value;
            const obj = {
                id: id ? parseInt(id) : Date.now(),
                nome: document.getElementById('cliNome').value.toUpperCase(),
                whatsapp: document.getElementById('cliZap').value,
                servidor: document.getElementById('cliServidor').value,
                login_cli: document.getElementById('cliLogin').value || '---',
                senha_cli: document.getElementById('cliSenha').value || '---',
                vencimento: document.getElementById('cliVenc').value
            };
            if(id) {
                const idx = clientes.findIndex(c => c.id == id);
                clientes[idx] = obj;
            } else {
                clientes.push(obj);
            }
            localStorage.setItem('next_data', JSON.stringify(clientes));
            render();
            closeModal('modalCliente');
        }

        function renovar(id) {
            const idx = clientes.findIndex(c => c.id == id);
            let d = new Date(clientes[idx].vencimento + 'T00:00:00');
            d.setDate(d.getDate() + 30);
            clientes[idx].vencimento = d.toISOString().split('T')[0];
            localStorage.setItem('next_data', JSON.stringify(clientes));
            render();
        }

        function remover(id) {
            if(confirm("EXCLUIR?")) {
                clientes = clientes.filter(c => c.id !== id);
                localStorage.setItem('next_data', JSON.stringify(clientes));
                render();
            }
        }

        function editarCliente(id) {
            const c = clientes.find(cli => cli.id === id);
            document.getElementById('editId').value = c.id;
            document.getElementById('cliNome').value = c.nome;
            document.getElementById('cliZap').value = c.whatsapp;
            document.getElementById('cliServidor').value = c.servidor;
            document.getElementById('cliLogin').value = c.login_cli;
            document.getElementById('cliSenha').value = c.senha_cli;
            document.getElementById('cliVenc').value = c.vencimento;
            openModal('modalCliente');
        }

        function render() {
            const grid = document.getElementById('client-grid');
            grid.className = viewMode;
            const busca = document.getElementById('busca').value.toUpperCase();
            const ordem = document.getElementById('ordem').value;
            grid.innerHTML = '';

            let filtrados = clientes.filter(c => c.nome.includes(busca));

            filtrados.sort((a, b) => {
                if (ordem === 'nome') return a.nome.localeCompare(b.nome);
                if (ordem === 'venc') return new Date(a.vencimento) - new Date(b.vencimento);
                if (ordem === 'srv') return a.servidor.localeCompare(b.servidor);
            });

            filtrados.forEach(c => {
                const dias = Math.ceil((new Date(c.vencimento + 'T00:00:00') - new Date().setHours(0,0,0,0)) / 86400000);
                let cor = "border-green", bg = "bg-green";
                if(dias <= 0) { cor = "border-red"; bg = "bg-red"; }
                else if(dias <= 7) { cor = "border-orange"; bg = "bg-orange"; }

                const zapNum = c.whatsapp.replace(/\D/g,'');

                grid.innerHTML += `
                    <div class="card ${cor}">
                        <div class="card-tools">
                            <button class="tool-btn" onclick="editarCliente(${c.id})">✏️</button>
                            <button class="tool-btn" onclick="remover(${c.id})">🗑️</button>
                        </div>
                        <div class="info-row" style="font-size:0.8rem;"><strong>${c.nome}</strong></div>
                        <div class="info-row">Srv: ${c.servidor}</div>
                        <div class="info-row">Log: ${c.login_cli}</div>
                        <div class="info-row">Sen: ${c.senha_cli}</div>
                        <div class="info-row">Venc: ${c.vencimento.split('-').reverse().join('/')}</div>
                        <div class="days-badge ${bg}">${dias <= 0 ? 'VENCIDO' : dias + ' DIAS'}</div>
                        <div class="action-area">
                            <button class="btn-renovar" onclick="renovar(${c.id})">RENOVAR</button>
                            <a href="https://api.whatsapp.com/send?phone=${zapNum}" target="_blank" style="display:flex; align-items:center;">
                                <svg width="22" height="22" viewBox="0 0 448 512"><path fill="#25D366" d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zm-157 341.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-69.8 18.3L72 359.2l-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.6-186.6 184.6zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18s-8.8-2.8-12.4 2.8-14.1 18-17.2 21.6-6.3 4.1-11.8 1.3c-5.5-2.8-23.3-8.6-44.4-27.5-16.4-14.6-27.4-32.7-30.6-38.2s-.3-8.5 2.5-11.2c2.5-2.5 5.5-6.4 8.3-9.6s3.7-5.5 5.5-9.1.9-6.7-.5-9.6-12.4-29.9-17-41.1c-4.5-10.9-9.1-9.4-12.4-9.6l-10.6-.2c-3.7 0-9.6 1.4-14.7 6.9-5.1 5.5-19.4 19-19.4 46.3s19.8 53.8 22.6 57.5c2.8 3.7 39.1 59.7 94.8 83.8 13.2 5.7 23.5 9.2 31.6 11.8 13.3 4.2 25.4 3.6 35 2.2 10.7-1.6 32.8-13.4 37.4-26.4s4.6-24.1 3.2-26.4c-1.4-2.5-5.1-3.9-10.6-6.6z"/></svg>
                            </a>
                        </div>
                    </div>
                `;
            });
        }

        const savedTheme = localStorage.getItem('next_theme');
        if(savedTheme) setTheme(savedTheme, null);
        render();
    </script>
</body>
</html>
